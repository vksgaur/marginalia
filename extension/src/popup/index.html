<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marginalia</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Loading View -->
    <div id="loadingView" class="view">
      <div class="spinner"></div>
    </div>

    <!-- Sign In View -->
    <div id="signInView" class="view hidden">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="20" fill="#6366f1"/>
          <rect x="22" y="20" width="56" height="8" rx="4" fill="#fde047" opacity="0.9"/>
          <rect x="22" y="36" width="48" height="8" rx="4" fill="#4ade80" opacity="0.9"/>
          <rect x="22" y="52" width="52" height="8" rx="4" fill="#60a5fa" opacity="0.9"/>
          <rect x="22" y="68" width="40" height="8" rx="4" fill="#f472b6" opacity="0.9"/>
        </svg>
      </div>
      <h1>Marginalia</h1>
      <p class="subtitle">Save articles to read later</p>
      <button id="signInBtn" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.96v2.332C2.438 15.983 5.482 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.96 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>
    </div>

    <!-- Save Form View -->
    <div id="saveFormView" class="view hidden">
      <div class="toolbar">
        <span class="toolbar-title">Marginalia</span>
        <button id="signOutBtn" class="btn-icon" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

      <div class="article-preview">
        <div id="articleTitle" class="article-title"></div>
        <div id="articleUrl" class="article-url"></div>
      </div>

      <div class="form-group">
        <label for="tagsInput">Tags</label>
        <input type="text" id="tagsInput" placeholder="web, javascript, design...">
        <small>Comma-separated, optional</small>
      </div>

      <button id="saveBtn" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save to Marginalia
      </button>

      <div id="status" class="status hidden"></div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
